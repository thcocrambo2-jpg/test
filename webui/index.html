<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Ember</title>
    <!-- The header's logo badge (Header.tsx, .logo): accent square, bold E. -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ffa116'/%3E%3Ctext x='16' y='16' dy='.35em' text-anchor='middle' font-family='Inter,ui-sans-serif,system-ui,Segoe UI,sans-serif' font-weight='700' font-size='22' fill='%231a1a1a'%3EE%3C/text%3E%3C/svg%3E"
    />
    <script>
      // Applied before first paint so the page never flashes the wrong theme.
      try {
        var t = localStorage.getItem('ember.theme');
        document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
