<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sniper chat</title>
<!-- The Chat page of the AWS sniper (chatprompt.py), opened from the sniper's
     Chat button and served by server.py at /chat. Ember's look: tokens.css
     (a copy of webui/src/theme/tokens.css) plus the styles below. -->
<link rel="stylesheet" href="/tokens.css">
<style>
/* ── Chat tab: Ember's look (webui/src shell, ui and fields styles), every
   rule scoped to #tab-chat so the sniper's own button / input styles stay
   out of it and nothing here reaches the other tabs. ── */
#tab-chat { display:grid; grid-template-columns:260px minmax(0,1fr); gap:0; position:relative; min-height:480px;
            border:1px solid var(--c-border); border-radius:var(--r-lg); overflow:hidden; background:var(--c-bg);
            font-size:var(--t-md); line-height:var(--lh-normal); -webkit-font-smoothing:antialiased; }
#tab-chat[hidden] { display:none; }
#tab-chat *, #tab-chat *::before, #tab-chat *::after { box-sizing:border-box; }
#tab-chat button { background:none; border:0; padding:0; color:inherit; font:inherit; font-weight:inherit; border-radius:0; cursor:pointer; }
#tab-chat button:hover { background:none; }
#tab-chat label { display:flex; flex-direction:row; gap:0; color:inherit; font-size:inherit; }
#tab-chat h2, #tab-chat h3, #tab-chat p { margin:0; }
#tab-chat .hidden { display:none !important; }
#tab-chat :focus-visible { outline:2px solid var(--c-focus); outline-offset:2px; border-radius:var(--r-xs); }
#tab-chat * { scrollbar-width:thin; scrollbar-color:var(--c-border-strong) transparent; }

/* button */
#tab-chat .btn { --bg:var(--c-elevated); --fg:var(--c-text); --bd:var(--c-border);
  display:inline-flex; align-items:center; justify-content:center; gap:var(--s-2); padding:0 var(--s-4); height:34px;
  border:1px solid var(--bd); border-radius:var(--r-md); background:var(--bg); color:var(--fg); font-size:var(--t-sm);
  font-weight:var(--fw-medium); white-space:nowrap;
  transition:background var(--d-fast) var(--e-out), border-color var(--d-fast) var(--e-out), transform var(--d-fast) var(--e-out); }
#tab-chat .btn:hover:not(:disabled) { background:var(--c-panel-hover); border-color:var(--c-border-strong); }
#tab-chat .btn:active:not(:disabled) { transform:translateY(1px); }
#tab-chat .btn:disabled { opacity:.48; cursor:not-allowed; }
#tab-chat .btn.primary { --bg:var(--c-accent); --fg:var(--c-text-on-accent); --bd:var(--c-accent); font-weight:var(--fw-semibold); }
#tab-chat .btn.primary:hover:not(:disabled) { background:var(--c-accent-hover); border-color:var(--c-accent-hover); }
#tab-chat .btn.ghost { --bg:transparent; --bd:transparent; color:var(--c-text-muted); }
#tab-chat .btn.ghost:hover:not(:disabled) { background:var(--c-panel-hover); border-color:transparent; color:var(--c-text); }
#tab-chat .btn.danger { --fg:var(--c-error); --bd:var(--c-error-line); --bg:transparent; }
#tab-chat .btn.danger:hover:not(:disabled) { background:var(--c-error-soft); border-color:var(--c-error); }
#tab-chat .btn.sm { height:28px; padding:0 var(--s-3); font-size:var(--t-xs); }
#tab-chat .btn.icon { padding:0; width:34px; }
#tab-chat .btn.icon.sm { width:28px; }
#tab-chat .btn.block { width:100%; }
#tab-chat .spinner { width:12px; height:12px; border-radius:50%; border:2px solid currentColor; border-right-color:transparent;
  animation:cspin 700ms linear infinite; flex:none; display:inline-block; }
@keyframes cspin { to { transform:rotate(360deg); } }

/* pill */
#tab-chat .pill { display:inline-flex; align-items:center; gap:var(--s-2); padding:3px var(--s-3); border-radius:var(--r-full);
  border:1px solid var(--c-border); background:var(--c-elevated); font-size:var(--t-xs); color:var(--c-text-muted); line-height:1.6; white-space:nowrap; }
#tab-chat .pill b { color:var(--c-text); font-weight:var(--fw-semibold); }
#tab-chat .pill.accent { border-color:var(--c-accent-line); background:var(--c-accent-soft); color:var(--c-accent); }
#tab-chat .pill.success { border-color:var(--c-success-line); background:var(--c-success-soft); color:var(--c-success); }
#tab-chat .pill.warning { border-color:var(--c-warning-line); background:var(--c-warning-soft); color:var(--c-warning); }
#tab-chat .pill.danger { border-color:var(--c-error-line); background:var(--c-error-soft); color:var(--c-error); }
#tab-chat button.pill:hover { border-color:var(--c-border-strong); color:var(--c-text); background:var(--c-elevated); }

/* fields */
#tab-chat .input, #tab-chat .select { width:100%; background:var(--c-input); color:var(--c-text); border:1px solid var(--c-border);
  border-radius:var(--r-md); padding:0 var(--s-3); height:34px; font:inherit; font-size:var(--t-sm); transition:border-color var(--d-fast) var(--e-out); }
#tab-chat .input:hover, #tab-chat .select:hover { border-color:var(--c-border-strong); }
#tab-chat .input:focus, #tab-chat .select:focus { outline:none; border-color:var(--c-accent); box-shadow:0 0 0 3px var(--c-accent-soft); }
#tab-chat .input::placeholder, #tab-chat textarea::placeholder { color:var(--c-text-faint); }
#tab-chat .select { appearance:none; padding-right:var(--s-8); cursor:pointer; background-image:var(--icon-caret);
  background-repeat:no-repeat; background-position:right var(--s-3) center; }
#tab-chat .select option { background:var(--c-input); }
#tab-chat .label { font-size:var(--t-xs); font-weight:var(--fw-medium); color:var(--c-text-muted); letter-spacing:.012em; }
#tab-chat .field { display:flex; flex-direction:column; gap:var(--s-2); min-width:0; }
#tab-chat .muted { color:var(--c-text-muted); font-size:var(--t-xs); }
#tab-chat .faint { color:var(--c-text-faint); font-size:var(--t-2xs); }
#tab-chat .grow { flex:1; }

/* chat list = Ember's nav */
#tab-chat .cnav { border-right:1px solid var(--c-border); background:var(--c-bg); padding:var(--s-4) var(--s-3) var(--s-3);
  display:flex; flex-direction:column; gap:var(--s-4); min-height:0; }
#tab-chat .navTop { display:flex; flex-direction:column; gap:var(--s-2); }
#tab-chat .search { position:relative; }
#tab-chat .search .input { padding-left:30px; }
#tab-chat .search span { position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--c-text-faint); font-size:var(--t-sm); pointer-events:none; }
#tab-chat .navScroll { flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:var(--s-5); }
#tab-chat .navGroup { display:flex; flex-direction:column; gap:2px; }
#tab-chat .navTitle { font-size:var(--t-2xs); font-weight:var(--fw-semibold); letter-spacing:.09em; text-transform:uppercase;
  color:var(--c-text-faint); padding:0 var(--s-3) var(--s-2); }
#tab-chat .navLink { display:flex; align-items:center; gap:var(--s-2); padding:var(--s-2) var(--s-2) var(--s-2) var(--s-3);
  border-radius:var(--r-md); color:var(--c-text-muted); font-size:var(--t-sm); font-weight:var(--fw-medium);
  border-left:2px solid transparent; cursor:pointer; transition:background var(--d-fast) var(--e-out), color var(--d-fast) var(--e-out); }
#tab-chat .navLink:hover { background:var(--c-panel); color:var(--c-text); }
#tab-chat .navLink.on, #tab-chat .navLink.on:hover { background:var(--c-accent-soft); color:var(--c-accent); border-left-color:var(--c-accent); }
#tab-chat .navLabel { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#tab-chat .navLink .more { opacity:0; padding:0 var(--s-1); border-radius:var(--r-xs); line-height:1; height:22px; }
#tab-chat .navLink:hover .more, #tab-chat .navLink.on .more, #tab-chat .navLink .more.open { opacity:1; }
#tab-chat .navLink .more:hover { background:var(--c-panel-hover); }
#tab-chat .navFoot { border-top:1px solid var(--c-border); padding-top:var(--s-3); display:flex; flex-direction:column; gap:var(--s-2); }
#tab-chat .spend { display:flex; justify-content:space-between; font-size:var(--t-2xs); color:var(--c-text-faint); padding:0 var(--s-1); font-variant-numeric:tabular-nums; }
#tab-chat .spend b { color:var(--c-text-muted); font-weight:var(--fw-semibold); }
#tab-chat .navEmpty { padding:var(--s-6) var(--s-3); text-align:center; color:var(--c-text-faint); font-size:var(--t-xs); }

/* menus and popovers */
#tab-chat .menu { position:fixed; z-index:var(--z-panel); background:var(--c-elevated); border:1px solid var(--c-border);
  border-radius:var(--r-md); box-shadow:var(--sh-lg); padding:var(--s-1); min-width:180px; animation:crise var(--d-base) var(--e-out); }
#tab-chat .menu button { display:flex; width:100%; align-items:flex-start; gap:var(--s-2); text-align:left;
  padding:var(--s-2) var(--s-3); border-radius:var(--r-sm); color:var(--c-text); font-size:var(--t-sm); }
#tab-chat .menu button:hover { background:var(--c-panel-hover); }
#tab-chat .menu button.danger { color:var(--c-error); }
#tab-chat .menu button small { display:block; color:var(--c-text-faint); font-size:var(--t-2xs); line-height:var(--lh-snug); }
#tab-chat .menu button .tick { width:14px; flex:none; color:var(--c-accent); }
#tab-chat .menu hr { border:0; border-top:1px solid var(--c-border); margin:var(--s-1) 0; }
#tab-chat .pop { position:fixed; z-index:var(--z-panel); width:min(340px, calc(100vw - 32px)); background:var(--c-elevated); border:1px solid var(--c-border);
  border-radius:var(--r-lg); box-shadow:var(--sh-lg); padding:var(--s-4); display:flex; flex-direction:column; gap:var(--s-3); animation:crise var(--d-base) var(--e-out); }
#tab-chat .pop h3 { font-size:var(--t-sm); font-weight:var(--fw-semibold); }
#tab-chat .pop .two { display:grid; grid-template-columns:1fr 1fr; gap:var(--s-3); }
#tab-chat .switch { display:flex; align-items:flex-start; gap:var(--s-2); font-size:var(--t-sm); line-height:var(--lh-normal); cursor:pointer; }
#tab-chat .switch input { accent-color:var(--c-accent); flex:none; width:15px; height:15px; margin:calc((1em * var(--lh-normal) - 15px) / 2) 0 0; }
#tab-chat .pop .row { display:flex; gap:var(--s-2); }
#tab-chat .pop .row .input { flex:1; min-width:0; }
/* where prompts go: on (accent), on with nothing to send to (warning), off (plain); one pulse per auto-send */
#tab-chat .autoPill { gap:var(--s-2); max-width:240px; }
#tab-chat .autoPill .at { overflow:hidden; text-overflow:ellipsis; min-width:0; }
#tab-chat .autoPill .dot { display:none; width:7px; height:7px; border-radius:var(--r-full); background:currentColor; flex:none; }
#tab-chat .autoPill.on, #tab-chat button.autoPill.on:hover { border-color:var(--c-accent-line); background:var(--c-accent-soft); color:var(--c-accent); }
#tab-chat .autoPill.warn, #tab-chat button.autoPill.warn:hover { border-color:var(--c-warning-line); background:var(--c-warning-soft); color:var(--c-warning); }
#tab-chat button.autoPill.on:hover, #tab-chat button.autoPill.warn:hover { filter:brightness(1.12); }
#tab-chat .autoPill.flash { animation:apulse 1.1s var(--e-out); }
@keyframes apulse { from { box-shadow:0 0 0 0 var(--c-accent-line); } to { box-shadow:0 0 0 10px transparent; } }
#tab-chat .caret { flex:none; width:10px; height:10px; background:var(--icon-caret) no-repeat center / contain; opacity:.8; }
#tab-chat .ratio { flex:none; display:inline-flex; align-items:center; justify-content:center; width:14px; height:14px; }
#tab-chat .menu button .ratio { height:calc(1em * var(--lh-normal)); }   /* level with the row's first line */
#tab-chat .ratio i { display:block; border:1.5px solid currentColor; border-radius:2px; }
@keyframes crise { from { opacity:0; transform:translateY(10px) scale(.99); } }

/* main column */
#tab-chat .cmain { display:flex; flex-direction:column; min-width:0; min-height:0; }
#tab-chat .chatHead { display:flex; align-items:center; gap:var(--s-3); padding:var(--s-3) var(--s-5); border-bottom:1px solid var(--c-border); min-height:52px; }
#tab-chat .chatTitle { font-size:var(--t-lg); font-weight:var(--fw-semibold); letter-spacing:-.012em; overflow:hidden; text-overflow:ellipsis;
  white-space:nowrap; cursor:text; border-radius:var(--r-xs); padding:2px var(--s-1); min-width:0; flex:1 1 0; margin-right:auto; }
#tab-chat .chatHead > :not(.chatTitle) { flex:none; }
#tab-chat .chatTitle:hover { background:var(--c-panel); }
#tab-chat .menuBtn { display:none; }
#tab-chat .scroll { flex:1; min-height:0; overflow-y:auto; }
#tab-chat .col { max-width:780px; margin:0 auto; padding:var(--s-6) var(--s-5) var(--s-4); display:flex; flex-direction:column; gap:var(--s-6); }

#tab-chat .uturn { display:flex; flex-direction:column; align-items:flex-end; gap:var(--s-2); }
#tab-chat .quote { display:flex; align-items:center; gap:var(--s-2); font-size:var(--t-xs); color:var(--c-text-muted);
  border-left:2px solid var(--c-accent); padding:2px 0 2px var(--s-2); max-width:80%; cursor:pointer; }
#tab-chat .quote:hover { color:var(--c-text); }
#tab-chat .ell { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
#tab-chat .thumbs { display:flex; gap:var(--s-2); flex-wrap:wrap; justify-content:flex-end; }
#tab-chat .bubble { background:var(--c-panel); border:1px solid var(--c-border); border-radius:var(--r-xl) var(--r-xl) var(--r-xs) var(--r-xl);
  padding:var(--s-3) var(--s-4); max-width:80%; white-space:pre-wrap; overflow-wrap:anywhere; }
#tab-chat .acts { display:flex; gap:2px; align-items:center; opacity:0; transition:opacity var(--d-fast) var(--e-out); }
#tab-chat .uturn:hover .acts, #tab-chat .aturn:hover .acts { opacity:1; }
#tab-chat .mention { color:var(--c-accent); background:var(--c-accent-soft); border-radius:var(--r-xs); padding:0 3px; font-weight:var(--fw-medium); }

#tab-chat .tile { position:relative; width:72px; height:88px; border-radius:var(--r-md); border:1px solid var(--c-border);
  background:var(--c-bg-sunken); overflow:hidden; flex:none; display:grid; place-items:center; color:var(--c-text-faint); font-size:var(--t-2xs); }
#tab-chat .tile img { width:100%; height:100%; object-fit:cover; display:block; }
#tab-chat .tile .h { position:absolute; left:0; right:0; bottom:0; padding:2px 6px; font-size:var(--t-2xs); color:var(--c-on-media);
  background:var(--c-media-chip); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-align:left; }

#tab-chat .aturn { display:flex; flex-direction:column; gap:var(--s-3); }
#tab-chat .talk { color:var(--c-text); white-space:pre-wrap; overflow-wrap:anywhere; }
#tab-chat .alert { display:flex; gap:var(--s-3); padding:var(--s-3) var(--s-4); border-radius:var(--r-md); border:1px solid var(--c-error-line);
  background:var(--c-error-soft); font-size:var(--t-sm); line-height:var(--lh-snug); overflow-wrap:anywhere; }
#tab-chat .pcard { background:var(--c-panel); border:1px solid var(--c-border); border-radius:var(--r-lg);
  transition:border-color var(--d-base) var(--e-out), box-shadow var(--d-base) var(--e-out); }
#tab-chat .pcard.target { border-color:var(--c-accent); box-shadow:0 0 0 3px var(--c-accent-soft); }
#tab-chat .pcard.flash { box-shadow:0 0 0 3px var(--c-info-soft); border-color:var(--c-info); }
#tab-chat .pcardHead { display:flex; align-items:center; gap:var(--s-2); flex-wrap:wrap; padding:var(--s-2) var(--s-3) var(--s-2) var(--s-4);
  border-bottom:1px solid var(--c-border); min-height:44px; }
#tab-chat .pcardTitle { font-size:var(--t-sm); font-weight:var(--fw-semibold); }
#tab-chat .trail { display:flex; align-items:center; gap:4px; font-size:var(--t-xs); color:var(--c-text-faint); }
#tab-chat .trail button { color:var(--c-text-muted); padding:1px 5px; border-radius:var(--r-xs); font-size:var(--t-xs); font-family:var(--font-mono); }
#tab-chat .trail button:hover { background:var(--c-panel-hover); color:var(--c-text); }
#tab-chat .trail button.cur { color:var(--c-accent); background:var(--c-accent-soft); }
#tab-chat .ptext { padding:var(--s-3) var(--s-4); white-space:pre-wrap; overflow-wrap:anywhere; font-size:var(--t-sm); line-height:var(--lh-loose);
  max-height:calc(var(--t-sm) * 1.7 * 10 + var(--s-6)); overflow-y:auto; overscroll-behavior:contain; position:relative; }
#tab-chat .ptext.open { max-height:none; overflow:visible; }
#tab-chat .cursor { display:inline-block; width:7px; height:1em; background:var(--c-accent); vertical-align:text-bottom; margin-left:2px; animation:cblink 1s steps(2) infinite; }
@keyframes cblink { 50% { opacity:0; } }
#tab-chat .pcardFoot { display:flex; align-items:center; gap:var(--s-1); flex-wrap:wrap; padding:var(--s-2) var(--s-3); border-top:1px solid var(--c-border); }
#tab-chat .meta { font-size:var(--t-2xs); color:var(--c-text-faint); font-family:var(--font-mono); font-variant-numeric:tabular-nums; padding-left:var(--s-1); }
#tab-chat .shimmer { height:14px; border-radius:var(--r-sm); background:var(--c-skeleton); position:relative; overflow:hidden; margin:var(--s-2) 0; }
#tab-chat .shimmer::after { content:''; position:absolute; inset:0; transform:translateX(-100%);
  background:linear-gradient(90deg, transparent, var(--c-skeleton-sheen), transparent); animation:csheen 1.4s infinite; }
@keyframes csheen { 100% { transform:translateX(100%); } }

/* composer */
#tab-chat .composerWrap { padding:0 var(--s-5) var(--s-4); }
#tab-chat .composer { width:100%; max-width:780px; margin:0 auto; background:var(--c-panel); border:1px solid var(--c-border); border-radius:var(--r-xl);
  box-shadow:var(--sh-md); padding:var(--s-2); position:relative; transition:border-color var(--d-fast) var(--e-out); }
#tab-chat .composer:focus-within { border-color:var(--c-border-strong); }
#tab-chat .composer.over { border-color:var(--c-accent); background:var(--c-accent-soft); }
#tab-chat .editChip { display:flex; align-items:center; gap:var(--s-2); margin:0 0 var(--s-2); padding:var(--s-2) var(--s-2) var(--s-2) var(--s-3);
  background:var(--c-accent-soft); border:1px solid var(--c-accent-line); border-radius:var(--r-md); font-size:var(--t-xs); color:var(--c-accent); }
#tab-chat .editChip .ell { flex:1; color:var(--c-text-muted); }
#tab-chat .editChip button { color:var(--c-accent); border-radius:var(--r-xs); width:22px; height:22px; flex:none; }
#tab-chat .editChip button:hover { background:var(--c-accent-soft); }
#tab-chat .attach { display:flex; gap:var(--s-2); flex-wrap:wrap; padding:0 var(--s-1) var(--s-2); }
#tab-chat .attach:empty { display:none; }
#tab-chat .achip { display:flex; align-items:center; gap:var(--s-2); padding:3px 4px 3px 3px; border:1px solid var(--c-border); border-radius:var(--r-md);
  background:var(--c-elevated); font-size:var(--t-xs); }
#tab-chat .achip .tile { width:28px; height:28px; border-radius:var(--r-sm); }
#tab-chat .achip .tile .h, #tab-chat .mopt .tile .h { display:none; }   /* the label beside a small thumbnail already says it */
#tab-chat .achip button { color:var(--c-text-faint); width:20px; height:20px; border-radius:var(--r-xs); }
#tab-chat .achip button:hover { color:var(--c-text); background:var(--c-panel-hover); }
#tab-chat .composer textarea { display:block; width:100%; border:0; background:transparent; resize:none; padding:var(--s-2) var(--s-3);
  min-height:44px; max-height:240px; line-height:var(--lh-normal); font:inherit; font-size:var(--t-md); color:var(--c-text); box-shadow:none; border-radius:0; }
#tab-chat .composer textarea:focus { outline:none; border:0; box-shadow:none; }
/* @handle highlight: the textarea's own text is transparent and the same text
   is drawn behind it, with known handles marked. Both boxes must lay text out
   identically: same font, padding, wrapping and scrollbar gutter. */
#tab-chat .inputWrap { position:relative; }
#tab-chat .composer textarea, #tab-chat .hl { scrollbar-gutter:stable; overflow-wrap:break-word; letter-spacing:normal; }
#tab-chat .composer textarea { position:relative; z-index:1; color:transparent; caret-color:var(--c-text); }
#tab-chat .composer textarea::selection { color:transparent; background:var(--c-accent-soft); }
#tab-chat .hl { position:absolute; inset:0; padding:var(--s-2) var(--s-3); margin:0; border:0; font:inherit; font-size:var(--t-md);
  line-height:var(--lh-normal); color:var(--c-text); white-space:pre-wrap; overflow:hidden; pointer-events:none; }
#tab-chat .hl mark { color:var(--c-accent); background:var(--c-accent-soft); border-radius:var(--r-xs);
  box-shadow:0 0 0 2px var(--c-accent-soft); }   /* spread, not padding: padding would shift the text */
#tab-chat .cbar { display:flex; align-items:center; gap:var(--s-1); padding:0 var(--s-1); }
#tab-chat .send { width:36px; height:36px; border-radius:var(--r-full); padding:0; font-size:var(--t-lg); }
#tab-chat .hintline { width:100%; max-width:780px; margin:var(--s-2) auto 0; font-size:var(--t-2xs); color:var(--c-text-faint); text-align:center; }

<script>
// ── Helpers (the same as the sniper page's) ──
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem("awssniper." + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("awssniper." + k, JSON.stringify(v)); } catch {} },
};
async function api(path, body) {
  const opt = body === undefined ? {} : {method: "POST", headers: {"content-type": "application/json", "x-sniper": "1"},
                                         body: JSON.stringify(body)};
  const r = await fetch(path, opt);
  const j = await r.json().catch(() => ({error: "Bad answer from the server (" + r.status + ")."}));
  if (!r.ok || j.error) throw new Error(j.error || r.statusText);
  return j;
}
async function shrinkImage(file, maxSide, maxBytes) {
  const name = file.name || `pasted-${Date.now()}.${file.type.split("/")[1]}`;
  let bmp;
  try { bmp = await createImageBitmap(file); } catch { return {blob: file, type: file.type, name}; }
  const side = Math.max(bmp.width, bmp.height);
  if (file.size <= maxBytes && side <= maxSide) { bmp.close(); return {blob: file, type: file.type, name}; }
  let scale = Math.min(1, maxSide / side), blob = null;
  for (let tries = 0; tries < 8; tries++) {
    const c = document.createElement("canvas");
    c.width = Math.max(1, Math.round(bmp.width * scale)); c.height = Math.max(1, Math.round(bmp.height * scale));
    const g = c.getContext("2d");
    g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height);      // transparent PNGs get a white background
    g.drawImage(bmp, 0, 0, c.width, c.height);
    for (const q of [0.92, 0.85, 0.75]) {
      blob = await new Promise(ok => c.toBlob(ok, "image/jpeg", q));
      if (blob && blob.size <= maxBytes) break;
    }
    if (blob && blob.size <= maxBytes) break;
    scale *= 0.8;
  }
  bmp.close();
  return {blob, type: "image/jpeg", name: name.replace(/\.[^.]*$/, "") + ".jpg"};
}
const readB64 = f => new Promise((ok, bad) => {
  const fr = new FileReader();
  fr.onload = () => ok(String(fr.result).split(",")[1]);
  fr.onerror = () => bad(fr.error || new Error("Couldn't read the file."));
  fr.readAsDataURL(f);
});

// ── Account (this page's own choice; starts from the sniper page's) ──
let ACCOUNTS = [], ACCOUNT = store.get("c.account", store.get("account", "main"));
const acct = () => ACCOUNT;
function drawAccounts() {
  if (ACCOUNTS.length && !ACCOUNTS.some(a => a.name === ACCOUNT)) ACCOUNT = ACCOUNTS[0].name;
  $("cAcct").innerHTML = (ACCOUNTS.length ? ACCOUNTS : [{name: ACCOUNT}]).map(a =>
    `<option value="${esc(a.name)}"${a.name === ACCOUNT ? " selected" : ""}>` +
    `${esc(a.name)}${a.id ? " · " + a.id : a.error ? " · keys not working" : ""}</option>`).join("");
}
$("cAcct").onchange = () => { ACCOUNT = $("cAcct").value; store.set("c.account", ACCOUNT); poll(); };
api("/api/config").then(cfg => { ACCOUNTS = cfg.accounts || []; drawAccounts(); })
  .catch(e => { $("cErr").textContent = "Couldn't load the accounts: " + e.message; });
drawAccounts();

// ── Instances, for ⤒ Queue and Auto-send ──
let LAST_ST = null;
async function poll() {
  try {
    const r = await fetch("/api/status?account=" + encodeURIComponent(acct()));
    const st = await r.json();
    if (r.ok) LAST_ST = st;
  } catch {}
}
poll(); setInterval(poll, 5000);
</script>
<script>
// ── Chat (chatprompt.py) ──
// Uses the helpers above: api(), store, esc, acct(), shrinkImage, readB64
// and LAST_ST (the polled instances).
// Every message goes out on its own; ✎ Edit on a prompt card sends only that
// prompt as context with the next message.
(() => {
"use strict";
const tab = $("tab-chat");
const C = {cfg: null, chats: [], open: {}, cur: null, draftMode: null, lib: [], edit: {}, attached: [],
           resend: null, streams: {}, sendChain: Promise.resolve(), appOpts: {}};
const SRC = {chat: "Chat", img: "Image to prompt", txt: "Text to prompt"};
const FORMATS = ["image/jpeg", "image/png", "image/webp", "image/gif"];
const money = v => v == null ? "—" : "$" + (v > 0 && v < 0.01 ? v.toFixed(4) : v.toFixed(3));
const words = s => ((s || "").trim().match(/\S+/g) || []).length;
const sleep = ms => new Promise(ok => setTimeout(ok, ms));
const imgUrl = (src, id) => `/api/chat/image?src=${encodeURIComponent(src)}&id=${encodeURIComponent(id)}`;
const libBy = h => C.lib.find(i => i.handle.toLowerCase() === String(h).toLowerCase());
const same = (a, b) => a.src === b.src && a.id === b.id;
const chat = () => (C.cur && C.open[C.cur]) || null;
const curMode = () => chat() ? chat().mode : C.draftMode;
const modeLabel = k => k === "free" ? "Free chat" : String(k || "").replace(/-/g, " ").replace(/^./, c => c.toUpperCase());
const isPrompt = m => m && m.prompt && !m.prompt.startsWith("SKIP:");
const isVideo = m => !!(C.cfg && (C.cfg.video_modes || []).includes(m && m.mode));   // copied by hand, never queued as a picture

// ── small helpers ────────────────────────────────────────────────────
const host = document.createElement("div"); host.className = "toastHost"; $("cFloat").appendChild(host);
function ctoast(msg) {
  const t = document.createElement("div"); t.className = "ctoast"; t.textContent = msg;
  host.appendChild(t); setTimeout(() => t.remove(), 3200);
}
const tile = p => `<div class="tile"><img src="${imgUrl(p.src, p.id)}" alt="" loading="lazy" onerror="this.remove()"><span class="h">@${esc(p.handle)}</span></div>`;
const withMentions = text => esc(text).replace(/@([A-Za-z0-9_-]{1,32})/g, (m, h) => libBy(h) ? `<span class="mention">@${esc(h)}</span>` : m);
function closeFloating() {
  $("cFloat").querySelectorAll(".menu,.pop").forEach(e => e.remove());
  tab.querySelectorAll(".more.open").forEach(e => e.classList.remove("open"));
}
function placeNear(el, anchor, alignRight) {
  $("cFloat").appendChild(el);
  const r = anchor.getBoundingClientRect(), w = el.offsetWidth, h = el.offsetHeight;
  let left = alignRight ? r.right - w : r.left, top = r.bottom + 6;
  if (top + h > innerHeight - 8) top = r.top - h - 6;
  el.style.left = Math.max(8, Math.min(left, innerWidth - w - 8)) + "px";
  el.style.top = Math.max(8, top) + "px";
}
document.addEventListener("click", e => { if (!e.target.closest("#tab-chat .menu, #tab-chat .pop, #tab-chat [data-float]")) closeFloating(); });
document.addEventListener("keydown", e => {
  if (e.key !== "Escape" || tab.hidden) return;
  const modal = $("cFloat").querySelector(".backdrop:last-of-type");
  if (modal) modal.remove(); else closeFloating();
});
function modal(html, cls = "") {
  const b = document.createElement("div"); b.className = "backdrop";
  b.innerHTML = `<div class="modal ${cls}" role="dialog">${html}</div>`;
  b.addEventListener("click", e => { if (e.target === b || e.target.closest("[data-close]")) b.remove(); });
  $("cFloat").appendChild(b); return b;
}
function confirmBox(title, text, okLabel, ok) {
  const b = modal(`<div class="modalHead"><div class="modalTitle">${esc(title)}</div></div>
    <div class="modalBody"><div class="muted" style="font-size:var(--t-sm)">${esc(text)}</div>
    <div class="modalFoot"><button class="btn" data-close>Cancel</button><button class="btn danger" data-ok>${esc(okLabel)}</button></div></div>`, "small");
  b.querySelector("[data-ok]").onclick = () => { b.remove(); ok(); };
}
function fit() {}                                    // the page is all chat: CSS sizes it
function ratioIcon(r) {                                // a little frame in the ratio's shape, as Google Flow shows it
  const [w, h] = String(r).split(":").map(Number), k = 12 / Math.max(w || 1, h || 1);
  return `<span class="ratio"><i style="width:${Math.max(5, Math.round((w || 1) * k))}px;height:${Math.max(5, Math.round((h || 1) * k))}px"></i></span>`;
}
function fades() {
  // prompts are small boxes that scroll inside; nothing to fade
}
// Follow the bottom from a send until you scroll up yourself. Growth alone
// (a picture loading, a reply streaming) fires no scroll event, so it
// can't switch following off the way the old distance check did.
let stick = true;
$("cScroll").addEventListener("scroll", () => {
  const s = $("cScroll"); stick = s.scrollHeight - s.scrollTop - s.clientHeight < 140;
}, {passive: true});
$("cCol").addEventListener("load", () => scrollBottom(false), true);     // thumbnails load after the jump
function scrollBottom(force) {
  const s = $("cScroll");
  if (force) stick = true;
  if (stick) s.scrollTop = s.scrollHeight;
}
function totals(t) {
  if (!t) return;
  $("cSpendS").textContent = money(t.session); $("cSpendT").textContent = money(t.total);
}

// ── loading ──────────────────────────────────────────────────────────
async function load() {
  C.cfg = await api("/api/chat");
  C.chats = C.cfg.chats;
  const saved = store.get("c.mode", null);
  if (!C.draftMode || !(C.draftMode in C.cfg.modes)) C.draftMode = saved in C.cfg.modes ? saved : C.cfg.default_mode;
  totals(C.cfg.totals);
  loadLib();
  const want = C.cur || store.get("c.cur", null);
  if (want && C.chats.some(c => c.id === want)) await openChat(want);
  else { C.cur = null; drawAll(); }
}
async function refreshList() {
  try { C.cfg = await api("/api/chat"); C.chats = C.cfg.chats; totals(C.cfg.totals); } catch {}
  drawList();
}
async function loadLib() {
  try { C.lib = (await api("/api/chat/library")).images; } catch {}
  $("cLibCount").textContent = C.lib.length || "";
  if (chat()) { drawConv(); }
  drawHl();                                            // handles in the box may only now be known
}
async function openChat(id) {
  if (!C.streams[id]) C.open[id] = await api("/api/chat/c?id=" + encodeURIComponent(id));
  C.cur = id; store.set("c.cur", id);
  C.attached = []; C.resend = null; $("cErr").textContent = "";
  drawAll(); scrollBottom(true);
}
function newDraft() {
  C.cur = null; store.set("c.cur", null); C.attached = []; C.resend = null; $("cErr").textContent = "";
  drawAll(); $("cInput").focus();

// pictures: upload, paste, drop
async function uploadFiles(files) {
  const imgs = files.filter(f => f.type.startsWith("image/"));
  if (!imgs.length) { if (files.length) $("cErr").textContent = "That isn't a picture."; return; }
  $("cErr").textContent = "";
  for (const f of imgs) {
    if (!FORMATS.includes(f.type)) { $("cErr").textContent = `${f.name}: use a JPEG, PNG, WebP or GIF.`; continue; }
    try {
      const s = await shrinkImage(f, 1536, 380 * 1024);     // the Text to prompt references' size: several fit one request
      const {image} = await api("/api/chat/upload", {name: s.name, type: s.type, data: await readB64(s.blob)});
      C.lib = [image].concat(C.lib.filter(i => !same(i, image)));
      $("cLibCount").textContent = C.lib.length;
      attach(image);
    } catch (e) { $("cErr").textContent = (f.name ? f.name + ": " : "") + e.message; }
  }
}
$("cAttachBtn").onclick = () => $("cFile").click();
$("cFile").onchange = () => { uploadFiles([...$("cFile").files]); $("cFile").value = ""; };
document.addEventListener("paste", e => {
  if (tab.hidden) return;
  const files = [...(e.clipboardData || {}).files || []].filter(f => f.type.startsWith("image/"));
  if (files.length) { e.preventDefault(); uploadFiles(files); }         // plain text pastes as usual
});

tab.addEventListener("drop", e => { e.preventDefault(); $("cComposer").classList.remove("over"); uploadFiles([...e.dataTransfer.files]); });

// ── sending ──────────────────────────────────────────────────────────
async function send() {
  if (C.cur && C.streams[C.cur]) { stop(C.cur); return; }
  syncAttached();
  const text = $("cInput").value.trim();
  if (!text && !C.attached.length) return;
  $("cErr").textContent = ""; closeMentions();
  let c = chat();
  if (!c) {
    try {
      c = await api("/api/chat/new", {mode: C.draftMode});
      C.open[c.id] = c; C.cur = c.id; store.set("c.cur", c.id);
      C.chats.unshift({id: c.id, title: c.title, mode: c.mode, pinned: false, created: c.created, updated: c.updated, count: 0});
    } catch (e) { $("cErr").textContent = e.message; return; }
  }
  const cid = c.id, editOf = C.edit[cid] ?? null, resend = C.resend;
  const draft = {text, attached: C.attached.slice(), resend, editOf};
  const body = {chat: cid, text, images: draft.attached.map(p => ({src: p.src, id: p.id})), account: acct(), mode: c.mode};
  if (editOf != null) body.edit_of = editOf;
  if (resend != null) body.resend_of = resend;
  $("cInput").value = ""; C.attached = []; C.resend = null; autosize();
  const keep = c.messages.slice();
  if (resend != null) { const i = c.messages.findIndex(m => m.id === resend); if (i >= 0) c.messages = c.messages.slice(0, i); }
  const tempUser = {id: "pending", role: "user", text, images: draft.attached, edit_of: editOf};
  const live = {id: "live", role: "assistant", text: "", live: true, mode: c.mode, edit_of: editOf};
  c.messages.push(tempUser, live);
  const ctrl = new AbortController();
  C.streams[cid] = {ctrl, live};
  drawAll(); scrollBottom(true);

  const putBack = msg => {             // refused before anything was saved: the message goes back in the box
    delete C.streams[cid]; c.messages = keep;
    if (C.cur === cid) {
      $("cInput").value = draft.text; C.attached = draft.attached; C.resend = draft.resend; C.edit[cid] = draft.editOf;
      autosize(); if (msg) $("cErr").textContent = msg;
    }
    drawAll();
  };
  let resp;
  try {
    resp = await fetch("/api/chat/send", {method: "POST", signal: ctrl.signal,
      headers: {"content-type": "application/json", "x-sniper": "1"}, body: JSON.stringify(body)});
  } catch (e) { return putBack(e.name === "AbortError" ? "" : "Can't reach the sniper server: " + e.message); }
  if (!resp.ok) { const j = await resp.json().catch(() => ({})); return putBack(j.error || resp.statusText); }

  let done = null, failed = null, buf = "";
  const reader = resp.body.getReader(), dec = new TextDecoder();
  try {
    for (;;) {
      const {value, done: end} = await reader.read();
      if (end) break;
      buf += dec.decode(value, {stream: true});
      let nl;
      while ((nl = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, nl); buf = buf.slice(nl + 1);
        if (!line.trim()) continue;
        let ev; try { ev = JSON.parse(line); } catch { continue; }
        if (ev.t === "user") { const i = c.messages.indexOf(tempUser); if (i >= 0) c.messages[i] = ev.msg; live.reply_to = ev.msg.id; drawConvIf(cid); if (C.cur === cid) scrollBottom(false); }
        else if (ev.t === "delta") { live.text += ev.text; drawLive(cid); }
        else if (ev.t === "done") done = ev;
        else if (ev.t === "error") failed = ev.error;
      }
    }
  } catch { /* Stop, or the line dropped: the server keeps what was written */ }
  delete C.streams[cid];
  if (done) {
    const msg = done.msg;                              // stays a small box; Show all opens it
    const i = c.messages.indexOf(live);
    if (i >= 0) c.messages[i] = msg; else c.messages.push(msg);
    totals(done.totals);
    if (msg.edit_of != null && msg.prompt && !msg.error) C.edit[cid] = msg.id;      // keep editing: the new version is the target
    if (store.get("c.auto", true) && isPrompt(msg) && !isVideo(msg) && !msg.stopped && !msg.error) queueMsg(cid, msg, true);
  } else {
    // Stopped or cut off: read back what the server saved (it saves once it notices).
    for (let n = 0; n < 12; n++) {
      await sleep(400);
      try { const fresh = await api("/api/chat/c?id=" + encodeURIComponent(cid)); if (!fresh.writing) { C.open[cid] = fresh; break; } } catch {}
    }
    if (failed && C.cur === cid) $("cErr").textContent = failed;
  }
  await refreshList();
  const row = C.chats.find(x => x.id === cid);         // the server names a chat from its first message
  if (row) (C.open[cid] || c).title = row.title;
  if (C.cur === cid) { drawHead(); drawConv(); drawComposer(); scrollBottom(false); }
  poll();                                              // fresh instance list for ⤒ Queue
}
function stop(cid) { const s = C.streams[cid]; if (s) { s.ctrl.abort(); ctoast("Stopped: what was written is kept."); } }
$("cSend").onclick = () => send();

// ── sending a prompt to an instance ──────────────────────────────────
// Where a prompt goes: any running sniper instance, in any account (the
// account picker only says who pays for Qwen), or an app link you typed in
// the settings popover for a pod the sniper didn't start (host:7860, optional #k=KEY).
const NR2_STEPS = 20;                                 // Natural Raw 2's own steps (prod DB, 11-22), shown until an app is read
const ASPECTS = ["1:1", "3:4", "4:3", "2:3", "3:2", "9:16", "16:9"];   // until the app's own list is read
const aspect = () => store.get("c.ar", "3:4");
const links = () => store.get("c.links", []);
function targets() {
  const inst = ((typeof LAST_ST !== "undefined" && LAST_ST && LAST_ST.instances) || [])
    .filter(i => i.state === "running" && i.url)
    .map(i => ({key: i.id, id: i.id, name: i.name || i.id, group: "Account " + i.account,
                note: (i.type || "") + (i.ready ? "" : " · app not answering")}));
  return inst.concat(links().map(l => ({key: "link:" + l.url, link: l.url, name: l.name, group: "Your links", note: ""})));
}
function pickTarget() { const rows = targets(); return rows.find(t => t.key === store.get("c.inst", null)) || rows[0] || null; }
const where = t => t.link ? "link=" + encodeURIComponent(t.link) : "id=" + encodeURIComponent(t.id);
const reading = {};
const needsRead = t => !C.appOpts[t.key] || !!C.appOpts[t.key].error;
function appOpts(t) {                                  // the target's preset steps and aspect list: read once, retried after an error
  if (!needsRead(t)) return Promise.resolve(C.appOpts[t.key]);
  return reading[t.key] = reading[t.key] || api("/api/chat/app?" + where(t))
    .catch(err => ({aspects: [], error: err.message}))
    .then(o => {
      C.appOpts[t.key] = o; delete reading[t.key];
      if (o.preset_steps != null) store.set("c.presetSteps", o.preset_steps);
      return o;
    });
}
setInterval(() => { const t = pickTarget(); if (t && needsRead(t)) appOpts(t); }, 15000);   // so the settings popover already knows the preset's steps
function normLink(raw) {                               // "1.2.3.4:7860" -> {url: "http://1.2.3.4:7860/", name}
  raw = raw.trim(); if (!raw) return null;
  try {
    const u = new URL(/^[a-z]+:\/\//i.test(raw) ? raw : "http://" + raw);
    if (!/^https?:$/.test(u.protocol) || !u.hostname) return null;
    return {url: u.origin + "/" + u.hash, name: u.host};
  } catch { return null; }
}
let autoFlash = 0;
function drawAuto() {                                  // the header pill: is auto-send on, and where would it go
  const b = $("cSettings"), on = store.get("c.auto", true), t = pickTarget();
  const sent = Date.now() < autoFlash;
  b.className = "pill autoPill" + (on ? (t ? " on" : " warn") : "") + (b.classList.contains("flash") ? " flash" : "");
  const text = sent ? "✓ sent" : !on ? "Manual" : t ? "Auto · " + t.name : "Auto · no instance";
  b.innerHTML = `<span>⤒</span><span class="dot"></span><span class="at">${esc(text)}</span><span class="caret"></span>`;
  b.title = !on ? "Auto-send is off: queue prompts with ⤒ Queue. Click for settings."
    : t ? `Auto-send is on: every new prompt goes to the top of ${t.name}'s queue. Click for settings.`
    : "Auto-send is on, but there is no running instance or app link to send to. Click to add a link.";
}
function flashAuto() {
  const b = $("cSettings");
  autoFlash = Date.now() + 2500; b.classList.remove("flash"); void b.offsetWidth; b.classList.add("flash");
  drawAuto(); setTimeout(drawAuto, 2600);
}
$("cSettings").addEventListener("animationend", () => $("cSettings").classList.remove("flash"));
setInterval(drawAuto, 3000);                           // instances come and go with the 5 s poll
drawAuto();
function queueMsg(cid, m, auto) {
  const t = pickTarget();
  if (!t) { ctoast(`${auto ? "Auto-send" : "Queue"}: no running instance or app link: start one, or add a link from the ⤒ pill at the top.`); return; }
  m.queueState = "sending"; drawConvIf(cid);
  C.sendChain = C.sendChain.then(async () => {           // one at a time, each landing on top of the last
    try {
      const res = await api("/api/chat/queue", Object.assign({chat: cid, msg: m.id,
        steps: store.get("c.steps", "") || null, aspect: aspect()}, t.link ? {link: t.link} : {id: t.id}));
      (m.queued = m.queued || []).push(res.sent);
      ctoast(`${auto ? "Auto-sent" : "Queued"} v${m.v} at the top on ${t.name} · ${aspect()}`);
      if (auto) flashAuto();
    } catch (e) { ctoast("Queue: " + e.message); }
    m.queueState = ""; drawConvIf(cid);
  });
}
$("cAspectPill").onclick = async e => {
  e.stopPropagation(); closeFloating();

  const draw = () => {
    const o = t && C.appOpts[t.key], have = o && o.aspects && o.aspects.length ? o.aspects : null;
    const rows = have ? have.map(a => [a.split(" ", 1)[0], a.slice(a.indexOf(" ") + 1).replace(/^\(|\)$/g, "")]) : ASPECTS.map(a => [a, ""]);
    m.innerHTML = rows.map(([r, label]) => `<button data-ar="${esc(r)}"><span class="tick">${r === aspect() ? "✓" : ""}</span>${ratioIcon(r)}
      <span><b>${esc(r)}</b>${label && label !== r ? `<small>${esc(label)}</small>` : ""}</span></button>`).join("") +
      `<hr><div class="faint" style="padding:6px 10px">${t ? (o ? (o.error ? esc(o.error) : "From " + esc(t.name)) : "Reading " + esc(t.name) + "…") : "No instance or link yet"}</div>`;
  };
  draw();
  m.onclick = ev => { const r = ev.target.closest("[data-ar]")?.dataset.ar; if (!r) return; store.set("c.ar", r); closeFloating(); drawComposer(); };

$("cSettings").onclick = async e => {
  e.stopPropagation();
  if ($("cFloat").querySelector(".pop")) { closeFloating(); return; }
  closeFloating();
  const p = document.createElement("div"); p.className = "pop";
  let cur = null;
  const draw = () => {
    const rows = targets(); cur = pickTarget();
    const o = cur && C.appOpts[cur.key], steps = store.get("c.steps", "");
    const preset = o && o.preset_steps != null ? o.preset_steps : store.get("c.presetSteps", NR2_STEPS);   // last one read, while no app is up
    const groups = [...new Set(rows.map(r => r.group))];
    p.innerHTML = `<h3>Send to the app</h3>
      <div class="muted">Krea 2 V2 · Natural Raw 2 · batch 1 · each job goes to the top of the queue. Aspect is the ▭ pill under the message box.</div>
      <div class="field"><span class="label">Instance</span><select class="select" id="cSetInst" ${rows.length ? "" : "disabled"}>${rows.length ? groups.map(g =>
        `<optgroup label="${esc(g)}">${rows.filter(r => r.group === g).map(r =>
          `<option value="${esc(r.key)}"${cur && r.key === cur.key ? " selected" : ""}>${esc(r.name)}${r.note ? " · " + esc(r.note) : ""}</option>`).join("")}</optgroup>`).join("")
        : `<option>None running · add a link below</option>`}</select></div>
      ${cur && cur.link ? `<button class="btn ghost sm" id="cLinkDel" style="align-self:flex-start">Remove ${esc(cur.name)} from your links</button>` : ""}
      <div class="field"><span class="label">Add an app link</span><div class="row">
        <input class="input" id="cLinkIn" placeholder="host:7860, or the app link with #k=…" autocomplete="off">
        <button class="btn" id="cLinkAdd">Add</button></div>
        <span class="faint">For a pod the sniper didn't start. Paste the full link if the app asks for a key.</span></div>
      <div class="field"><span class="label">Steps${steps === "" && preset != null ? " · the preset's" : ""}</span><input class="input" id="cSetSteps" type="number" min="1" max="150" step="1"
          placeholder="preset" value="${esc(steps !== "" ? steps : preset != null ? preset : "")}"></div>
      <label class="switch"><input type="checkbox" id="cSetAuto"${store.get("c.auto", true) ? " checked" : ""}><span>Auto-send every new prompt to the top of the queue</span></label>
      ${o && o.error ? `<div class="faint">${esc(o.error)}</div>` : cur && !o ? `<div class="faint">Reading the app's preset…</div>` : ""}`;
  };
  const load = async () => { draw(); drawAuto(); if (cur && needsRead(cur)) { await appOpts(cur); if (p.isConnected && document.activeElement?.id !== "cSetSteps") draw(); } };
  const addLink = () => {
    const l = normLink($("cLinkIn").value);
    if (!l) { ctoast("That isn't an app link: try host:7860 or https://…"); return; }
    store.set("c.links", links().filter(x => x.url !== l.url).concat(l));
    store.set("c.inst", "link:" + l.url); delete C.appOpts["link:" + l.url];
    ctoast(`Added ${l.name}: prompts now go there`); load();
  };
  p.addEventListener("change", ev => {
    const id = ev.target.id;
    if (id === "cSetInst") { store.set("c.inst", ev.target.value); load(); }
    if (id === "cSetAuto") { store.set("c.auto", ev.target.checked); drawAuto(); }
  });
  p.addEventListener("input", ev => {                  // the preset's own number, or a cleared box, keeps following the preset
    if (ev.target.id !== "cSetSteps") return;
    const v = ev.target.value.trim(), o = cur && C.appOpts[cur.key];
    const preset = o && o.preset_steps != null ? o.preset_steps : store.get("c.presetSteps", NR2_STEPS);
    store.set("c.steps", preset != null && Number(v) === preset ? "" : v);
  });
  p.addEventListener("focusout", ev => { if (ev.target.id === "cSetSteps" && !ev.target.value.trim()) draw(); });
  p.addEventListener("keydown", ev => { if (ev.target.id === "cLinkIn" && ev.key === "Enter") { ev.preventDefault(); addLink(); } });
  p.addEventListener("click", ev => {
    ev.stopPropagation();                              // a redraw detaches the clicked button: don't let it read as an outside click
    if (ev.target.id === "cLinkAdd") addLink();
    if (ev.target.id === "cLinkDel" && cur && cur.link) {
      store.set("c.links", links().filter(x => x.url !== cur.link)); store.set("c.inst", null);
      ctoast(`Removed ${cur.name}`); load();
    }
  });
  placeNear(p, $("cSettings"), true);
  load();
};

// ── library ──────────────────────────────────────────────────────────
let libFilter = "all", libQ = "";
function openLibrary() {
  const b = modal(`<div class="modalHead"><div><div class="modalTitle">Library</div>
      <div class="muted">Every picture on this PC: chat uploads, Image to prompt and Text to prompt. Click one to attach it.</div></div>
      <button class="btn ghost icon" data-close title="Close">✕</button></div>
    <div class="modalBody">
      <div class="libBar"><div class="segmented" id="cLibSeg"></div>
        <div class="search"><span>⌕</span><input class="input" id="cLibSearch" placeholder="Search name or @handle" autocomplete="off"></div>
        <button class="btn sm" data-upload>📎 Upload</button></div>
      <div class="libGrid" id="cLibGrid"></div></div>`, "lib");
  b.querySelector("#cLibSearch").value = libQ;
  const draw = () => {
    b.querySelector("#cLibSeg").innerHTML = [["all", "All"], ["chat", "Chat"], ["img", "Image to prompt"], ["txt", "Text to prompt"]].map(([k, l]) =>
      `<button class="segment${libFilter === k ? " on" : ""}" data-f="${k}">${l} <span class="faint">${k === "all" ? C.lib.length : C.lib.filter(i => i.src === k).length}</span></button>`).join("");
    const q = libQ.toLowerCase();
    const items = C.lib.filter(i => (libFilter === "all" || i.src === libFilter) && (!q || (i.handle + " " + i.name).toLowerCase().includes(q)));
    b.querySelector("#cLibGrid").innerHTML = items.length ? items.map(i => {
      const on = C.attached.some(x => same(x, i)), k = esc(i.src + ":" + i.id);
      return `<div class="lcard${on ? " picked" : ""}">
        <div class="tile" data-view="${k}" title="View full size"><img src="${imgUrl(i.src, i.id)}" alt="" loading="lazy" onerror="this.remove()"></div>
        <div class="lbody"><span class="lh">@${esc(i.handle)}</span><span class="ln" title="${esc(i.name)}">${esc(i.name)}</span>
          <span><span class="pill">${SRC[i.src]}</span></span>
          <div class="lacts"><button class="btn ghost sm" data-pick="${k}">${on ? "✓ Attached" : "＋ Attach"}</button>
            <button class="btn ghost icon sm" data-rename="${k}" title="Rename the handle">✎</button>
            ${i.src === "chat" ? `<button class="btn ghost icon sm" data-del="${k}" title="Delete (chat uploads only)">🗑</button>` : ""}</div></div></div>`;
    }).join("") : `<div class="empty" style="grid-column:1/-1"><b>Nothing here</b><span class="muted">${C.lib.length ? "No picture matches." : "Upload a picture, or add some on the prompt tabs."}</span></div>`;
  };
  draw();
  b.querySelector("#cLibSearch").oninput = e => { libQ = e.target.value; draw(); };
  b.addEventListener("click", async e => {
    const el = e.target.closest("[data-f],[data-pick],[data-rename],[data-del],[data-view],[data-upload]"); if (!el) return;
    const d = el.dataset, item = k => C.lib.find(i => i.src + ":" + i.id === k);
    if (d.f) { libFilter = d.f; draw(); }
    else if (d.pick) {
      const p = item(d.pick); if (!p) return;
      if (C.attached.some(x => same(x, p))) {
        C.attached = C.attached.filter(x => !same(x, p));
        $("cInput").value = $("cInput").value.replace(new RegExp("@" + p.handle + "(?![A-Za-z0-9_-])\\s?", "gi"), "");
        autosize(); drawComposer();
      } else attach(p);
      draw();
    }
    else if (d.view) {
      const p = item(d.view); if (!p) return;
      modal(`<div class="modalHead"><div class="modalTitle">@${esc(p.handle)} <span class="muted">${esc(p.name)} · ${SRC[p.src]}</span></div>
        <button class="btn ghost icon" data-close>✕</button></div><div class="modalBody"><img src="${imgUrl(p.src, p.id)}" alt=""></div>`, "view");
    }
    else if (d.rename) {
      const p = item(d.rename); if (!p) return;
      const n = prompt("New handle (letters, digits, - or _)", p.handle);
      if (!n || n.trim().replace(/^@/, "") === p.handle) return;
      try {
        const r = await api("/api/chat/handle", {src: p.src, id: p.id, handle: n.trim()});
        const old = p.handle; p.handle = r.handle;
        C.attached.forEach(x => { if (same(x, p)) x.handle = r.handle; });
        $("cInput").value = $("cInput").value.replace(new RegExp("@" + old + "(?![A-Za-z0-9_-])", "gi"), "@" + r.handle);
        draw(); drawComposer(); ctoast(`Renamed to @${r.handle}. Messages already sent keep the old name.`);
      } catch (err) { ctoast(err.message); }
    }
    else if (d.del) {
      const p = item(d.del); if (!p) return;
      confirmBox(`Delete @${p.handle}?`, "The picture file goes for good. Chats that mentioned it keep their text.", "Delete", async () => {
        try {
          await api("/api/chat/image/delete", {src: p.src, id: p.id});
          C.lib = C.lib.filter(i => !same(i, p)); C.attached = C.attached.filter(x => !same(x, p));
          $("cLibCount").textContent = C.lib.length || ""; draw(); drawComposer();
        } catch (err) { ctoast(err.message); }
      });
    }
    else if ("upload" in d) {
      const f = document.createElement("input"); f.type = "file"; f.multiple = true; f.accept = FORMATS.join(",");
      f.onchange = async () => { await uploadFiles([...f.files]); draw(); }; f.click();
    }
  });
}
