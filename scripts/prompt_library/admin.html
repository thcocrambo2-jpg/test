<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Prompt library · admin</title>
<style>
  :root { color-scheme: dark; --bg:#0f1115; --panel:#181b22; --line:#2a2f3a; --text:#e7e9ee; --dim:#9aa1ad; --accent:#f59e0b; --on:#22c55e; --pub:#38bdf8; --bad:#ef4444; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 system-ui, sans-serif; }
  header { position:sticky; top:0; z-index:5; background:var(--bg); border-bottom:1px solid var(--line); padding:12px 20px; display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  h1 { font-size:16px; margin:0 12px 0 0; }
  .count { color:var(--dim); }
  select, input[type=text], textarea { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:6px 8px; font:inherit; }
  button { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:6px 10px; font:inherit; cursor:pointer; }
  button:hover { border-color:var(--dim); }
  button.primary { background:var(--accent); color:#111; border-color:var(--accent); font-weight:600; }
  button.danger { color:var(--bad); }
  button:disabled { opacity:.45; cursor:default; }
  .spacer { flex:1; }
  main { padding:16px 20px 80px; }
  .upload { background:var(--panel); border:1px dashed var(--line); border-radius:10px; padding:14px; margin-bottom:16px; display:grid; gap:10px; }
  .upload.drag { border-color:var(--accent); }
  .upload .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .upload textarea { width:100%; min-height:54px; resize:vertical; }
  .hint { color:var(--dim); font-size:12px; }
  .log { max-height:180px; overflow:auto; font:12px/1.4 ui-monospace, monospace; color:var(--dim); white-space:pre-wrap; }
  .log .err { color:var(--bad); } .log .ok { color:var(--on); }
  .bulk { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:12px; min-height:34px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:12px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden; display:flex; flex-direction:column; }
  .card.selected { outline:2px solid var(--accent); }
  .card.dragging { opacity:.4; }
  .card.over { outline:2px dashed var(--pub); }
  .thumb { position:relative; aspect-ratio:3/4; background:#0b0d10; cursor:zoom-in; }
  .thumb img { width:100%; height:100%; object-fit:cover; display:block; }
  .thumb .pick { position:absolute; top:8px; left:8px; width:18px; height:18px; }
  .badges { position:absolute; top:8px; right:8px; display:flex; gap:4px; }
  .badge { font-size:11px; padding:2px 6px; border-radius:99px; background:#000a; }
  .badge.on { color:var(--on); } .badge.pub { color:var(--pub); }
  .meta { padding:8px; display:grid; gap:6px; }
  .meta input[type=text] { width:100%; padding:4px 6px; }
  .tab { color:var(--dim); font-size:12px; }
  .toggles { display:flex; gap:10px; font-size:12px; }
  .toggles label { display:flex; gap:4px; align-items:center; cursor:pointer; }
  .actions { display:flex; gap:6px; }
  .actions button { padding:3px 8px; font-size:12px; }
  .empty { color:var(--dim); padding:40px; text-align:center; }
  .lightbox { position:fixed; inset:0; background:#000e; display:none; align-items:center; justify-content:center; z-index:10; cursor:zoom-out; }
  .lightbox.open { display:flex; }
  .lightbox img { max-width:96vw; max-height:96vh; }
  .toast { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:var(--panel); border:1px solid var(--line); padding:8px 14px; border-radius:8px; display:none; z-index:20; }
  .toast.show { display:block; } .toast.err { border-color:var(--bad); }
</style>
</head>
<body>
<header>
  <h1>🌟 Prompt library · admin</h1>
  <span class="count" id="count"></span>
  <span class="spacer"></span>
  <select id="fTab"><option value="">Every tab</option></select>
  <select id="fState">
    <option value="">Everything</option>
    <option value="enabled">For customers</option>
    <option value="disabled">Not for customers</option>
    <option value="public">On the showcase</option>
    <option value="private">Not on the showcase</option>
  </select>
  <button id="reload" title="Read the index from R2 again">Reload</button>
</header>
<main>
  <section class="upload" id="drop">
    <div class="row">
      <strong>Add pictures</strong>
      <span class="hint">Drop pictures with their .txt tokens, a folder, or a Gallery zip. A pair is a picture and a .txt with the same name. New entries start switched off.</span>
    </div>
    <div class="row">
      <button id="pickFiles">Choose files or zip…</button>
      <button id="pickFolder">Choose a folder…</button>
      <input type="file" id="files" multiple hidden accept="image/png,image/jpeg,image/webp,.txt,.zip">
      <input type="file" id="folder" webkitdirectory multiple hidden>
    </div>
    <details>
      <summary class="hint">…or one picture and a pasted token</summary>
      <div class="row" style="margin-top:8px">
        <input type="file" id="onePic" accept="image/png,image/jpeg,image/webp">
        <input type="text" id="oneTitle" placeholder="Title (optional)" style="flex:1">
      </div>
      <textarea id="oneToken" placeholder="ember2.…;"></textarea>
      <div class="row"><button class="primary" id="oneAdd">Add</button></div>
    </details>
    <div class="log" id="log"></div>
  </section>

  <div class="bulk" id="bulk"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>Nothing here yet.</div>
</main>
<div class="lightbox" id="lightbox"><img alt=""></div>
<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id)
let entries = []
let labels = {}
const selected = new Set()

async function call(path, body, raw) {
  const response = await fetch(path, {
    method: body === undefined ? 'GET' : 'POST',
    headers: { 'x-library-admin': '1', ...(raw ? {} : { 'content-type': 'application/json' }) },
    body: body === undefined ? undefined : raw ? body : JSON.stringify(body),
  })
  const data = await response.json().catch(() => ({ error: `HTTP ${response.status}` }))
  if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`)
  return data
}

function toast(text, bad) {
  const el = $('toast')
  el.textContent = text
  el.className = 'toast show' + (bad ? ' err' : '')
  clearTimeout(toast.timer)
  toast.timer = setTimeout(() => (el.className = 'toast'), bad ? 6000 : 2200)
}

function log(text, kind) {
  const line = document.createElement('div')
  if (kind) line.className = kind
  line.textContent = text
  $('log').prepend(line)
}

async function load(reload) {
  try {
    const data = await call('/api/state' + (reload ? '?reload=1' : ''))
    entries = data.entries
    labels = data.labels
    for (const id of [...selected]) if (!entries.some((e) => e.id === id)) selected.delete(id)
    const tabSelect = $('fTab')
    const current = tabSelect.value
    const present = [...new Set(entries.map((e) => e.tab))]
    tabSelect.innerHTML = '<option value="">Every tab</option>' +
      present.map((tab) => `<option value="${tab}">${escapeHtml(labels[tab] || tab)}</option>`).join('')
    tabSelect.value = present.includes(current) ? current : ''
    render()
  } catch (error) {
    toast(error.message, true)
  }
}

function escapeHtml(text) {
  return String(text ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c])
}

function visible() {
  const tab = $('fTab').value
  const state = $('fState').value
  return entries.filter((e) =>
    (!tab || e.tab === tab) &&
    (!state ||
      (state === 'enabled' && e.enabled) || (state === 'disabled' && !e.enabled) ||
      (state === 'public' && e.public) || (state === 'private' && !e.public)))
}

const filtered = () => Boolean($('fTab').value || $('fState').value)

function render() {
  const shown = visible()
  const on = entries.filter((e) => e.enabled).length
  const pub = entries.filter((e) => e.public).length
  $('count').textContent = `${entries.length} entries · ${on} for customers · ${pub} on the showcase`
  $('empty').hidden = shown.length > 0
  $('grid').innerHTML = ''
  for (const entry of shown) $('grid').append(card(entry))
  renderBulk(shown)
}

function renderBulk(shown) {
  const bar = $('bulk')
  const n = selected.size
  bar.innerHTML = ''
  const all = document.createElement('button')
  all.textContent = n && shown.every((e) => selected.has(e.id)) ? 'Select none' : `Select all shown (${shown.length})`
  all.onclick = () => {
    if (shown.every((e) => selected.has(e.id))) shown.forEach((e) => selected.delete(e.id))
    else shown.forEach((e) => selected.add(e.id))
    render()
  }
  bar.append(all)
  if (!n) {
    const hint = document.createElement('span')
    hint.className = 'hint'
    hint.textContent = filtered() ? 'Clear the filters to drag cards into order.' : 'Drag cards to set the order customers see.'
    bar.append(hint)
    return
  }
  const label = document.createElement('span')
  label.textContent = `${n} selected:`
  bar.append(label)
  const actions = [
    ['For customers', { enabled: true }],
    ['Not for customers', { enabled: false }],
    ['On showcase', { public: true }],
    ['Off showcase', { public: false }],
  ]
  for (const [text, changes] of actions) {
    const button = document.createElement('button')
    button.textContent = text
    button.onclick = () => update([...selected], changes)
    bar.append(button)
  }
  const del = document.createElement('button')
  del.className = 'danger'
  del.textContent = `Delete ${n}`
  del.onclick = () => remove([...selected])
  bar.append(del)
}

function card(entry) {
  const el = document.createElement('div')
  el.className = 'card' + (selected.has(entry.id) ? ' selected' : '')
  el.dataset.id = entry.id
  el.innerHTML = `
    <div class="thumb">
      <img loading="lazy" alt="" src="${escapeHtml(entry.thumb || '')}">
      <input type="checkbox" class="pick" ${selected.has(entry.id) ? 'checked' : ''} title="Select">
      <div class="badges">
        ${entry.enabled ? '<span class="badge on">customers</span>' : ''}
        ${entry.public ? '<span class="badge pub">showcase</span>' : ''}
      </div>
    </div>
    <div class="meta">
      <div class="tab">${escapeHtml(entry.tabLabel)} · ${entry.width}×${entry.height}</div>
      <input type="text" class="title" placeholder="Title (optional)" value="${escapeHtml(entry.title)}">
      <div class="toggles">
        <label><input type="checkbox" class="enabled" ${entry.enabled ? 'checked' : ''}> Customers</label>
        <label><input type="checkbox" class="public" ${entry.public ? 'checked' : ''}> Showcase</label>
      </div>
      <div class="actions">
        <button class="copy" title="Copy the settings token">Copy token</button>
        <button class="top" title="Move to the front">To front</button>
        <button class="danger del">Delete</button>
      </div>
    </div>`
  el.querySelector('.thumb img').onclick = () => openFull(entry.full)
  el.querySelector('.pick').onchange = (event) => {
    if (event.target.checked) selected.add(entry.id)
    else selected.delete(entry.id)
    render()
  }
  el.querySelector('.enabled').onchange = (event) => update([entry.id], { enabled: event.target.checked })
  el.querySelector('.public').onchange = (event) => update([entry.id], { public: event.target.checked })
  const title = el.querySelector('.title')
  title.onchange = () => update([entry.id], { title: title.value })
  el.querySelector('.copy').onclick = async () => {
    try { await navigator.clipboard.writeText(entry.token); toast('Token copied') } catch { toast('Could not reach the clipboard', true) }
  }
  el.querySelector('.top').onclick = () => {
    const ids = entries.map((e) => e.id).filter((id) => id !== entry.id)
    order([entry.id, ...ids])
  }
  el.querySelector('.del').onclick = () => remove([entry.id])
  if (!filtered()) dragHandlers(el)
  return el
}

let dragged = null
function dragHandlers(el) {
  el.draggable = true
  el.ondragstart = () => { dragged = el.dataset.id; el.classList.add('dragging') }
  el.ondragend = () => { dragged = null; el.classList.remove('dragging') }
  el.ondragover = (event) => { if (dragged && dragged !== el.dataset.id) { event.preventDefault(); el.classList.add('over') } }
  el.ondragleave = () => el.classList.remove('over')
  el.ondrop = (event) => {
    event.preventDefault()
    el.classList.remove('over')
    if (!dragged || dragged === el.dataset.id) return
    const ids = entries.map((e) => e.id).filter((id) => id !== dragged)
    ids.splice(ids.indexOf(el.dataset.id), 0, dragged)
    order(ids)
  }
}

function openFull(url) {
  const box = $('lightbox')
  box.querySelector('img').src = url || ''
  box.classList.add('open')
}
$('lightbox').onclick = () => $('lightbox').classList.remove('open')
document.addEventListener('keydown', (event) => { if (event.key === 'Escape') $('lightbox').classList.remove('open') })

async function update(ids, changes) {
  try {
    const data = await call('/api/update', { ids, changes })
    const byId = Object.fromEntries(data.entries.map((e) => [e.id, e]))
    entries = entries.map((e) => byId[e.id] || e)
    render()
    toast(ids.length > 1 ? `${ids.length} entries saved` : 'Saved')
  } catch (error) {
    toast(error.message, true)
    load()
  }
}

async function order(ids) {
  try {
    await call('/api/order', { ids })
    const byId = Object.fromEntries(entries.map((e) => [e.id, e]))
    entries = ids.map((id) => byId[id])
    render()
  } catch (error) {
    toast(error.message, true)
    load()
  }
}

async function remove(ids) {
  if (!confirm(`Delete ${ids.length === 1 ? 'this entry' : ids.length + ' entries'} and ${ids.length === 1 ? 'its pictures' : 'their pictures'} from R2? This cannot be undone.`)) return
  try {
    await call('/api/delete', { ids })
    ids.forEach((id) => selected.delete(id))
    entries = entries.filter((e) => !ids.includes(e.id))
    render()
    toast(`Deleted ${ids.length}`)
  } catch (error) {
    toast(error.message, true)
    load()
  }
}

// ── Uploads ──────────────────────────────────────────────────────────

const IMAGE = /\.(png|jpe?g|webp)$/i
const stem = (path) => path.replace(/\.[^./\\]+$/, '').toLowerCase()

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader()
    reader.onload = () => resolve(String(reader.result).split(',')[1] || '')
    reader.onerror = () => reject(reader.error)
    reader.readAsDataURL(file)
  })
}

function report(result) {
  if (result.entry) {
    log(`✓ ${result.name} → ${result.entry.tabLabel}`, 'ok')
    entries = [result.entry, ...entries]
  } else if (result.skipped) {
    log(`– ${result.name}: ${result.skipped}`)
  } else {
    log(`✗ ${result.name}: ${result.error}`, 'err')
  }
}

async function addFiles(files) {
  const zips = files.filter((f) => /\.zip$/i.test(f.name))
  const pictures = new Map()
  const tokens = new Map()
  for (const file of files) {
    const path = file.webkitRelativePath || file.name
    if (IMAGE.test(path)) pictures.set(stem(path), file)
    else if (/\.txt$/i.test(path)) tokens.set(stem(path), file)
  }
  for (const zip of zips) {
    log(`… ${zip.name}: uploading the zip`)
    try {
      const data = await call('/api/upload-zip', zip, true)
      data.results.forEach(report)
      data.unpaired.forEach((name) => log(`– ${name}`))
      log(`${zip.name}: ${data.results.filter((r) => r.entry).length} added`)
    } catch (error) {
      log(`✗ ${zip.name}: ${error.message}`, 'err')
    }
    render()
  }
  const pairs = [...pictures.keys()].sort().filter((key) => tokens.has(key))
  for (const key of pictures.keys()) if (!tokens.has(key)) log(`– ${pictures.get(key).name}: no .txt token beside it`)
  for (const key of tokens.keys()) if (!pictures.has(key) && !/\.zip$/i.test(key)) log(`– ${tokens.get(key).name}: no picture beside it`)
  // Three at a time: encoding a full-size WebP takes the server about a
  // second, and three keeps the CPU busy without racing the index saves.
  let done = 0
  const queue = [...pairs]
  async function worker() {
    while (queue.length) {
      const key = queue.shift()
      const picture = pictures.get(key)
      try {
        const result = await call('/api/upload', {
          name: picture.name,
          image: await fileToBase64(picture),
          token: await tokens.get(key).text(),
        })
        report({ ...result, name: picture.name })
      } catch (error) {
        log(`✗ ${picture.name}: ${error.message}`, 'err')
      }
      done += 1
      $('count').textContent = `uploading ${done} / ${pairs.length}…`
      if (done % 10 === 0) render()
    }
  }
  await Promise.all([worker(), worker(), worker()])
  if (pairs.length) log(`Done: ${done} pairs looked at.`)
  render()
}

$('pickFiles').onclick = () => $('files').click()
$('pickFolder').onclick = () => $('folder').click()
$('files').onchange = (event) => { addFiles([...event.target.files]); event.target.value = '' }
$('folder').onchange = (event) => { addFiles([...event.target.files]); event.target.value = '' }

async function filesFromDrop(items) {
  const out = []
  async function walk(entry, path) {
    if (entry.isFile) {
      const file = await new Promise((resolve, reject) => entry.file(resolve, reject))
      Object.defineProperty(file, 'webkitRelativePath', { value: path + file.name })
      out.push(file)
    } else if (entry.isDirectory) {
      const reader = entry.createReader()
      let batch
      do {
        batch = await new Promise((resolve, reject) => reader.readEntries(resolve, reject))
        for (const child of batch) await walk(child, path + entry.name + '/')
      } while (batch.length)
    }
  }
  for (const item of items) {
    const entry = item.webkitGetAsEntry && item.webkitGetAsEntry()
    if (entry) await walk(entry, '')
  }
  return out
}

const drop = $('drop')
drop.ondragover = (event) => { if (!dragged) { event.preventDefault(); drop.classList.add('drag') } }
drop.ondragleave = () => drop.classList.remove('drag')
drop.ondrop = async (event) => {
  if (dragged) return
  event.preventDefault()
  drop.classList.remove('drag')
  addFiles(await filesFromDrop([...event.dataTransfer.items]))
}

$('oneAdd').onclick = async () => {
  const picture = $('onePic').files[0]
  const token = $('oneToken').value
  if (!picture || !token.trim()) return toast('Choose a picture and paste its token', true)
  try {
    const result = await call('/api/upload', {
      name: picture.name,
      image: await fileToBase64(picture),
      token,
      title: $('oneTitle').value,
    })
    report({ ...result, name: picture.name })
    if (result.entry) { $('onePic').value = ''; $('oneToken').value = ''; $('oneTitle').value = '' }
    render()
  } catch (error) {
    toast(error.message, true)
  }
}

$('fTab').onchange = render
$('fState').onchange = render
$('reload').onclick = () => load(true)
load()
</script>
</body>
</html>
